<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RobotDonut</title>
<meta name="theme-color" content="#f4f1fb">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%236a4cff' stroke-width='7'/%3E%3C/svg%3E">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('rd-theme'); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-d: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --accent: #6a4cff;
  --accent-hi: #7f66ff;
  --accent-soft: rgba(106, 76, 255, .12);
  --accent-ring: rgba(106, 76, 255, .28);
  --bg: #f4f1fb;
  --ink: #1b1430;
  --ink-2: #645d7e;
  --ink-3: #9791ad;
  --glass: rgba(255, 255, 255, .58);
  --glass-2: rgba(255, 255, 255, .84);
  --line: rgba(84, 52, 170, .12);
  --hi: rgba(255, 255, 255, .95);
  --shadow: 0 1px 2px rgba(40, 20, 100, .05), 0 14px 44px rgba(70, 40, 160, .10);
  --mesh-a: rgba(124, 92, 255, .30);
  --mesh-b: rgba(204, 178, 255, .50);
  --mesh-c: rgba(150, 120, 255, .20);
  --danger: #d02f6b;
  --ok: #17935f;
  --r: 20px;
  --ease: cubic-bezier(.22, .8, .24, 1);
}
[data-theme="dark"] {
  --accent: #8b74ff;
  --accent-hi: #a08cff;
  --accent-soft: rgba(139, 116, 255, .16);
  --accent-ring: rgba(139, 116, 255, .35);
  --bg: #0c0817;
  --ink: #f2efff;
  --ink-2: #aaa4c6;
  --ink-3: #6f6990;
  --glass: rgba(255, 255, 255, .055);
  --glass-2: rgba(30, 22, 52, .82);
  --line: rgba(255, 255, 255, .09);
  --hi: rgba(255, 255, 255, .13);
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 18px 54px rgba(0, 0, 0, .45);
  --mesh-a: rgba(106, 76, 255, .34);
  --mesh-b: rgba(160, 90, 255, .16);
  --mesh-c: rgba(80, 60, 200, .22);
  --danger: #ff6b9a;
  --ok: #45d39a;
}

* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--bg);
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  transition: background-color .3s var(--ease), color .3s var(--ease);
}
body::before {
  content: "";
  position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(52% 44% at 12% -4%, var(--mesh-a), transparent 70%),
    radial-gradient(46% 40% at 96% 6%, var(--mesh-b), transparent 70%),
    radial-gradient(60% 46% at 66% 108%, var(--mesh-c), transparent 70%);
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
h1, h2, h3 { font-family: var(--font-d); letter-spacing: -.022em; line-height: 1.15; font-weight: 650; }
h1 { font-size: 30px; }
h3 { font-size: 17px; letter-spacing: -.012em; }
p { color: var(--ink-2); }
.muted { color: var(--ink-3); font-size: 13px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
::selection { background: var(--accent-ring); }

.i { width: 18px; height: 18px; flex: none; }
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(28px) saturate(170%);
  backdrop-filter: blur(28px) saturate(170%);
  border: 1px solid var(--line);
  box-shadow: inset 0 1px 0 var(--hi), var(--shadow);
  border-radius: var(--r);
}
.glass-2 {
  background: var(--glass-2);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid var(--line);
  box-shadow: inset 0 1px 0 var(--hi), var(--shadow);
}

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 38px; padding: 0 15px; border-radius: 12px;
  font-weight: 560; font-size: 14px; white-space: nowrap;
  background: var(--glass-2);
  border: 1px solid var(--line);
  box-shadow: inset 0 1px 0 var(--hi);
  transition: transform .15s var(--ease), background-color .2s, box-shadow .2s;
}
.btn:hover { background: var(--accent-soft); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .55; pointer-events: none; }
.btn.primary {
  color: #fff; border-color: transparent;
  background: linear-gradient(180deg, var(--accent-hi), var(--accent));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 6px 18px var(--accent-ring);
}
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--danger); }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn.icon { width: 38px; padding: 0; }
.btn.block { width: 100%; height: 44px; font-size: 15px; }

/* fields */
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; font-weight: 560; color: var(--ink-2); }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=search], textarea, select {
  width: 100%; font: inherit; color: var(--ink);
  background: var(--glass-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 13px;
  transition: border-color .2s, box-shadow .2s;
  box-shadow: inset 0 1px 2px rgba(40, 20, 100, .04);
}
textarea { resize: vertical; min-height: 96px; line-height: 1.55; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
input::placeholder, textarea::placeholder { color: var(--ink-3); }

/* auth */
.auth { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
.auth-card { width: 100%; max-width: 400px; padding: 34px 30px 28px; border-radius: 28px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-d); font-weight: 680; font-size: 19px; letter-spacing: -.02em; }
.auth-card .brand { margin-bottom: 26px; }
.auth-card h1 { font-size: 26px; margin-bottom: 6px; }
.auth-card > p { margin-bottom: 22px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; border-radius: 12px; background: var(--accent-soft); margin-bottom: 20px; }
.seg button { height: 34px; border-radius: 9px; font-weight: 560; font-size: 14px; color: var(--ink-2); transition: all .2s var(--ease); }
.seg button[aria-selected=true] { background: var(--glass-2); color: var(--ink); box-shadow: 0 1px 3px rgba(40, 20, 100, .14), inset 0 1px 0 var(--hi); }
.link { color: var(--accent); font-weight: 560; font-size: 13.5px; }
.msg { font-size: 13.5px; padding: 10px 12px; border-radius: 12px; margin-bottom: 14px; }
.msg.err { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
.msg.ok { background: color-mix(in srgb, var(--ok) 13%, transparent); color: var(--ok); }

/* shell */
.app { display: grid; grid-template-columns: 240px 1fr; gap: 16px; padding: 16px; min-height: 100dvh; }
.side { position: sticky; top: 16px; height: calc(100dvh - 32px); display: flex; flex-direction: column; padding: 18px 12px 12px; }
.side .brand { padding: 2px 10px 22px; }
.nav { display: grid; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 11px; height: 40px; padding: 0 12px;
  border-radius: 12px; color: var(--ink-2); font-weight: 560; font-size: 14.5px;
  transition: background-color .2s, color .2s;
}
.nav a:hover { background: var(--accent-soft); color: var(--ink); }
.nav a[aria-current=page] { background: var(--accent-soft); color: var(--accent); }
.side-foot { margin-top: auto; display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.me { display: flex; align-items: center; gap: 10px; padding: 6px 8px; min-width: 0; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(160deg, var(--accent-hi), var(--accent)); color: #fff; display: grid; place-items: center; font-weight: 650; font-size: 13px; flex: none; }
.me b { display: block; font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me span { display: block; font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.foot-row { display: flex; gap: 8px; }
.foot-row .btn { flex: 1; }

main { min-width: 0; padding: 14px 10px 40px; max-width: 1000px; width: 100%; margin: 0 auto; }
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 26px; flex-wrap: wrap; }
.page-h p { margin-top: 6px; }
.page-h .acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* content blocks */
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.tile { padding: 18px; display: flex; flex-direction: column; gap: 8px; text-align: left; transition: transform .2s var(--ease), border-color .2s; min-height: 132px; }
a.tile:hover, button.tile:hover { transform: translateY(-2px); border-color: var(--accent-ring); }
.tile h3 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile p { font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tile .meta { margin-top: auto; display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink-3); }
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 14px; }
.stat { padding: 18px; }
.stat b { display: block; font-family: var(--font-d); font-size: 32px; letter-spacing: -.03em; font-weight: 650; line-height: 1.1; }
.stat span { font-size: 13px; color: var(--ink-2); }
.section-t { font-size: 14px; font-weight: 600; color: var(--ink-2); margin: 28px 2px 12px; }
.list { display: grid; }
.row { display: flex; align-items: center; gap: 14px; padding: 13px 18px; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--accent-soft); }
.row .grow { flex: 1; min-width: 0; }
.row .grow b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .grow span { font-size: 13px; color: var(--ink-3); }
.empty { text-align: center; padding: 56px 24px; }
.empty h3 { margin-bottom: 6px; }
.empty .btn { margin-top: 18px; }
.drop { padding: 22px; text-align: center; border-style: dashed; color: var(--ink-2); margin-bottom: 16px; transition: border-color .2s, background-color .2s; font-size: 14px; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.searchbar { margin-bottom: 14px; max-width: 360px; }
.editor { padding: 22px; display: grid; gap: 14px; }
.editor input.title { font-family: var(--font-d); font-size: 22px; font-weight: 650; letter-spacing: -.02em; background: transparent; border-color: transparent; box-shadow: none; padding: 6px 8px; margin: 0 -8px; }
.editor input.title:hover { border-color: var(--line); }
.editor textarea { min-height: 340px; background: transparent; box-shadow: none; }
.editor-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.editor-bar .sp { flex: 1; }

/* flashcard study */
.study { max-width: 620px; margin: 0 auto; }
.bar { height: 5px; border-radius: 9px; background: var(--accent-soft); overflow: hidden; margin-bottom: 22px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 9px; transition: width .35s var(--ease); }
.flip { perspective: 1400px; height: 340px; cursor: pointer; }
.flip-in { position: relative; width: 100%; height: 100%; transition: transform .55s var(--ease); transform-style: preserve-3d; }
.flip.on .flip-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; padding: 34px; text-align: center; font-family: var(--font-d); font-size: 22px; letter-spacing: -.015em; line-height: 1.35; overflow: auto; border-radius: 28px; }
.face.back { transform: rotateY(180deg); }
.face small { position: absolute; top: 16px; left: 0; right: 0; font-family: var(--font); font-size: 12px; color: var(--ink-3); letter-spacing: 0; }
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
.rate .btn { height: 46px; flex-direction: column; gap: 0; line-height: 1.2; }
.rate .btn small { font-weight: 450; color: var(--ink-3); font-size: 11.5px; }
.rate .btn.primary small { color: rgba(255, 255, 255, .75); }
.hint { text-align: center; margin-top: 14px; }
.cardrow { display: grid; grid-template-columns: 1fr 1fr auto; gap: 16px; align-items: start; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.cardrow:last-child { border-bottom: 0; }
.cardrow p { color: var(--ink); font-size: 14px; white-space: pre-wrap; }
.cardrow p + p { color: var(--ink-2); }

/* quiz */
.q { max-width: 680px; margin: 0 auto; }
.q h2 { font-size: 24px; margin-bottom: 20px; line-height: 1.25; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; padding: 14px 16px; border-radius: 14px; background: var(--glass-2); border: 1px solid var(--line); box-shadow: inset 0 1px 0 var(--hi); display: flex; gap: 12px; align-items: flex-start; transition: all .18s var(--ease); }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt .k { width: 24px; height: 24px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 12.5px; font-weight: 650; flex: none; }
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
.opt.right .k { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 11%, transparent); }
.opt.wrong .k { background: var(--danger); color: #fff; }
.opt:disabled { cursor: default; }
.explain { margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: var(--accent-soft); font-size: 14px; color: var(--ink); }
.score { text-align: center; padding: 42px 24px; }
.score b { display: block; font-family: var(--font-d); font-size: 68px; letter-spacing: -.04em; font-weight: 650; line-height: 1; margin-bottom: 8px; }
.qblock { padding: 14px; border: 1px solid var(--line); border-radius: 16px; margin-bottom: 12px; background: var(--glass); display: grid; gap: 8px; }
.qblock .optline { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: center; }
.qblock input[type=radio] { accent-color: var(--accent); width: 16px; height: 16px; }

/* AI */
.ai { display: grid; grid-template-rows: auto 1fr; height: calc(100dvh - 190px); min-height: 460px; gap: 12px; }
.sources { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.sources::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 99px; background: var(--glass-2); border: 1px solid var(--line); font-size: 13.5px; font-weight: 540; white-space: nowrap; cursor: pointer; transition: all .18s var(--ease); flex: none; max-width: 240px; }
.chip span { overflow: hidden; text-overflow: ellipsis; }
.chip input { display: none; }
.chip:has(input:checked) { background: var(--accent); border-color: transparent; color: #fff; }
.chip:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.chat { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.msgs { flex: 1; overflow-y: auto; padding: 22px 22px 8px; display: flex; flex-direction: column; gap: 14px; }
.m { max-width: 86%; padding: 11px 15px; border-radius: 18px; font-size: 14.5px; line-height: 1.6; word-wrap: break-word; }
.m p { color: inherit; }
.m p + p, .m ul + p, .m p + ul { margin-top: 9px; }
.m ul { padding-left: 20px; }
.m code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .9em; background: var(--accent-soft); padding: 1px 6px; border-radius: 6px; }
.m.user { align-self: flex-end; background: linear-gradient(180deg, var(--accent-hi), var(--accent)); color: #fff; border-bottom-right-radius: 6px; }
.m.bot { align-self: flex-start; background: var(--glass-2); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.m .note { display: block; margin-bottom: 8px; font-size: 12.5px; color: var(--ink-3); }
.dots { display: inline-flex; gap: 4px; padding: 6px 0; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); animation: dot 1.1s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
.composer { display: flex; gap: 10px; align-items: flex-end; padding: 12px 14px 14px; }
.composer textarea { min-height: 44px; max-height: 140px; resize: none; padding: 11px 14px; border-radius: 16px; }
.quick { display: flex; gap: 8px; padding: 0 14px 10px; flex-wrap: wrap; }
.chat-empty { margin: auto; text-align: center; max-width: 340px; }
.chat-empty h3 { margin-bottom: 6px; }

/* sheet, toast, spinner */
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: rgba(14, 8, 30, .38); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: fade .2s; }
.sheet { width: 100%; max-width: 520px; max-height: 88dvh; display: flex; flex-direction: column; border-radius: 26px; animation: pop .28s var(--ease); }
.sheet.wide { max-width: 680px; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; padding: 20px 22px 6px; }
.sheet-b { padding: 12px 22px; overflow-y: auto; }
.sheet-f { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px 20px; }
.x { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--ink-2); }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 90; padding: 11px 18px; border-radius: 99px; font-size: 14px; font-weight: 520; max-width: calc(100vw - 32px); animation: pop .28s var(--ease); }
.toast.err { color: var(--danger); }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--accent-soft); border-top-color: var(--accent); animation: rot .7s linear infinite; display: inline-block; }
.spin.sm { width: 16px; height: 16px; border-width: 2px; border-color: rgba(255,255,255,.35); border-top-color: #fff; }
@keyframes rot { to { transform: rotate(360deg); } }
.loading { display: grid; place-items: center; padding: 80px 0; }
.crumb { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 14px; font-weight: 540; margin-bottom: 14px; }
.crumb:hover { color: var(--accent); }
.hist { display: grid; }

/* small screens: sidebar becomes a bottom bar */
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; padding: 10px 10px 92px; gap: 0; }
  .side { position: fixed; z-index: 30; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); top: auto; height: auto; padding: 6px; flex-direction: row; border-radius: 24px; }
  .side .brand, .side-foot .me, .nav a span { display: none; }
  .nav { grid-auto-flow: column; grid-auto-columns: 1fr; flex: 1; }
  .nav a { height: 48px; justify-content: center; padding: 0; }
  .nav a .i { width: 22px; height: 22px; }
  .side-foot { margin: 0; padding: 0 0 0 4px; border: 0; display: flex; }
  .foot-row .btn[data-act=signout] { display: none; }
  .foot-row .btn { height: 48px; width: 48px; flex: none; }
  main { padding: calc(10px + env(safe-area-inset-top, 0px)) 4px 20px; }
  h1 { font-size: 26px; }
  .flip { height: 300px; }
  .face { font-size: 19px; padding: 26px; }
  .cardrow { grid-template-columns: 1fr auto; }
  .cardrow p + p { grid-column: 1; }
  .ai { height: calc(100dvh - 220px); }
  .m { max-width: 92%; }
  .overlay { place-items: end center; padding: 0; }
  .sheet { border-radius: 26px 26px 0 0; max-height: 92dvh; }
  .toast { bottom: 100px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
[hidden] { display: none !important; }
</style>

<body>
<div id="root"></div>

let toastT;
function toast(msg, kind) {
  $('.toast')?.remove(); clearTimeout(toastT);
  const t = document.createElement('div');
  t.className = 'toast glass-2' + (kind === 'err' ? ' err' : ''); t.textContent = msg;

}

function sheet({ title, body, submit = 'Save', danger = false, wide = false, onSubmit, onOpen }) {
  const el = document.createElement('div'); el.className = 'overlay';
  el.innerHTML = `<form class="sheet glass-2${wide ? ' wide' : ''}" role="dialog" aria-label="${esc(title)}">
    <div class="sheet-h"><h3>${esc(title)}</h3><button type="button" class="x" data-close aria-label="Close">${ic('x')}</button></div>
    <div class="sheet-b">${body}</div>
    <div class="sheet-f"><button type="button" class="btn" data-close>Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" type="submit">${esc(submit)}</button></div></form>`;
  document.body.appendChild(el);
  const close = () => { el.remove(); document.removeEventListener('keydown', esc_); };
  const esc_ = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', esc_);
  el.addEventListener('mousedown', e => { if (e.target === el) close(); });
  $$('[data-close]', el).forEach(b => b.onclick = close);
  const form = $('form', el);
  form.onsubmit = async e => {
    e.preventDefault();
    const btn = $('[type=submit]', form), label = btn.textContent;
    btn.disabled = true; btn.innerHTML = '<span class="spin sm"></span>';
    try { const r = await onSubmit(new FormData(form), form); if (r === false) { btn.disabled = false; btn.textContent = label; } else close(); }
    catch (err) { toast(err.message || String(err), 'err'); btn.disabled = false; btn.textContent = label; }
  };
  onOpen?.(el, form, close);
  setTimeout(() => $('input:not([type=radio]),textarea,select', el)?.focus(), 30);
  return close;
}

function applyTheme(t) {

  const b = $('[data-act=theme]'); if (b) b.innerHTML = ic(t === 'dark' ? 'sun' : 'moon');
}
async function toggleTheme() {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  if (state.user) await sb.from('user_settings').upsert({ user_id: state.user.id, theme: next });
}
async function loadSettings() {
  const { data } = await sb.from('user_settings').select('theme').eq('user_id', state.user.id).maybeSingle();

/* file → text */
const decodeXml = s => { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; };
async function extractText(file) {
  const ext = file.name.split('.').pop().toLowerCase(), buf = () => file.arrayBuffer();
  if (['txt', 'md', 'markdown', 'csv'].includes(ext)) return await file.text();
  if (ext === 'pptx') {
    const zip = await JSZip.loadAsync(await buf());
    const slides = Object.keys(zip.files).filter(f => /^ppt\/slides\/slide\d+\.xml$/.test(f)).sort((a, b) => a.match(/\d+/)[0] - b.match(/\d+/)[0]);
    const out = [];
    for (const [i, f] of slides.entries()) {
      const xml = await zip.file(f).async('string');
      const lines = xml.split('</a:p>').map(p => [...p.matchAll(/<a:t[^>]*>([^<]*)<\/a:t>/g)].map(m => decodeXml(m[1])).join('')).filter(Boolean);
      const nf = `ppt/notesSlides/notesSlide${f.match(/\d+/)[0]}.xml`; let notes = '';
      if (zip.files[nf]) { const nx = await zip.file(nf).async('string'); notes = nx.split('</a:p>').map(p => [...p.matchAll(/<a:t[^>]*>([^<]*)<\/a:t>/g)].map(m => decodeXml(m[1])).join('')).filter(l => l && !/^\d+$/.test(l)).join('\n'); }
      out.push(`Slide ${i + 1}\n${lines.join('\n')}${notes ? `\nSpeaker notes: ${notes}` : ''}`);
    }
    return out.join('\n\n');
  }
  if (ext === 'docx') {
    const zip = await JSZip.loadAsync(await buf()); const xml = await zip.file('word/document.xml').async('string');
    return xml.split('</w:p>').map(p => [...p.matchAll(/<w:t[^>]*>([^<]*)<\/w:t>/g)].map(m => decodeXml(m[1])).join('')).filter(Boolean).join('\n');
  }
  if (ext === 'pdf') {
    const pdf = await pdfjsLib.getDocument({ data: await buf() }).promise; const out = [];
    for (let p = 1; p <= pdf.numPages; p++) { const pg = await pdf.getPage(p); const tc = await pg.getTextContent(); out.push(tc.items.map(i => i.str + (i.hasEOL ? '\n' : '')).join(' ').replace(/ +/g, ' ').trim()); }
    return out.join('\n\n');
  }
  if (ext === 'ppt' || ext === 'doc') throw new Error(`Older .${ext} files aren't supported. Save as .${ext}x and upload again.`);
  throw new Error(`.${ext} files aren't supported yet.`);
}
async function uploadFiles(files) {
  files = files.filter(Boolean); if (!files.length) return;
  for (const f of files) {
    try {
      toast(`Reading ${f.name}…`);
      const text = (await extractText(f)).trim();
      const ext = f.name.split('.').pop().toLowerCase();
      if (!text) toast(`No readable text found in ${f.name}. Scanned pages need OCR first.`, 'err');
      const path = `${state.user.id}/${crypto.randomUUID()}-${f.name.replace(/[^\w.\-]+/g, '_')}`;
      const { error: ue } = await sb.storage.from('notes').upload(path, f, { contentType: f.type || undefined });
      if (ue) toast('Saved the text, but the original file could not be stored: ' + ue.message, 'err');
      await q(sb.from('notes').insert({ title: f.name.replace(/\.[^.]+$/, ''), content: text, file_path: ue ? null : path, file_name: f.name, file_type: ext, file_size: f.size }));
      toast(`Added ${f.name}`);
    } catch (e) { toast(e.message || String(e), 'err'); }
  }
  route();
}

async function vStudy(deckId) {
  const all = new URLSearchParams(location.hash.split('?')[1] || '').get('all');
  const deck = await q(sb.from('decks').select('title').eq('id', deckId).single());
  let cards = await q(sb.from('flashcards').select('*').eq('deck_id', deckId).order('due_at'));
  let queue = all ? shuffle(cards) : cards.filter(c => new Date(c.due_at) <= Date.now());
  const total = queue.length; let done = 0, flipped = false;
  const v = $('#view');
  if (!total) { v.innerHTML = `<div class="study"><a class="crumb" href="#/flashcards/${deckId}">${ic('back')}${esc(deck.title)}</a>${empty('All caught up', 'No cards are due in this deck right now.', `<button class="btn primary" onclick="location.hash='#/flashcards/${deckId}/study?all=1'">Study everything anyway</button>`)}</div>`; return; }

  const nextIn = (c, g) => {
    if (g === 0) return { days: 10 / 1440, ease: Math.max(1.3, c.ease - .2), reps: 0, label: '10 min' };
    const reps = c.reps + 1;
    let days = reps === 1 ? (g === 2 ? 3 : 1) : reps === 2 ? (g === 2 ? 6 : 3) : Math.round(c.interval_days * c.ease * (g === 2 ? 1.3 : 1));
    days = Math.max(1, days);
    return { days, ease: g === 2 ? c.ease + .15 : c.ease, reps, label: days === 1 ? '1 day' : days + ' days' };
  };
  const draw = () => {
    const c = queue[0];
    if (!c) { v.innerHTML = `<div class="study"><div class="score glass"><b>${total}</b><h3>${total === 1 ? 'Card' : 'Cards'} reviewed</h3><p style="margin:6px 0 20px">Nice session. They'll come back when it's time.</p><button class="btn primary" onclick="location.hash='#/flashcards/${deckId}'">Back to deck</button></div></div>`; return; }
    flipped = false;
    v.innerHTML = `<div class="study"><a class="crumb" href="#/flashcards/${deckId}">${ic('back')}${esc(deck.title)}</a>
      <div class="bar"><i style="width:${done / total * 100}%"></i></div>
      <div class="flip" id="flip" tabindex="0" role="button" aria-label="Flip card"><div class="flip-in">
        <div class="face glass-2"><small>Question</small>${esc(c.front)}</div>
        <div class="face back glass-2"><small>Answer</small>${esc(c.back)}</div></div></div>
      <div id="rateWrap"><p class="muted hint">Tap the card or press space to reveal</p></div></div>`;
    const flip = $('#flip');
    const reveal = () => {
      if (flipped) return; flipped = true; flip.classList.add('on');
      $('#rateWrap').innerHTML = `<div class="rate">
        <button class="btn" data-g="0">Again<small>${nextIn(c, 0).label}</small></button>
        <button class="btn primary" data-g="1">Good<small>${nextIn(c, 1).label}</small></button>
        <button class="btn" data-g="2">Easy<small>${nextIn(c, 2).label}</small></button></div>`;
      $$('[data-g]').forEach(b => b.onclick = () => rate(+b.dataset.g));
    };
    const rate = async g => {
      const n = nextIn(c, g);
      sb.from('flashcards').update({ ease: n.ease, reps: n.reps, interval_days: n.days, due_at: new Date(Date.now() + n.days * 864e5).toISOString() }).eq('id', c.id).then(() => {});
      queue.shift(); if (g === 0) queue.push({ ...c, ease: n.ease, reps: 0 }); else done++;
      draw();
    };
    flip.onclick = reveal;
    window._rdKey = e => { if (e.code === 'Space') { e.preventDefault(); reveal(); } else if (flipped && ['1', '2', '3'].includes(e.key)) rate(+e.key === 1 ? 0 : +e.key === 2 ? 1 : 2); };
  };
  document.removeEventListener('keydown', window._rdKeyL || (() => {}));
  window._rdKeyL = e => { if (!location.hash.includes('/study')) return; window._rdKey?.(e); };
  document.addEventListener('keydown', window._rdKeyL);
  draw();
}

function runQuiz(quiz, qs) {
  const v = $('#view'); qs = shuffle(qs); let i = 0, score = 0; const answers = [];
  const show = () => {
    const x = qs[i], opts = x.options;
    v.innerHTML = `<div class="q"><a class="crumb" href="#/quizzes/${quiz.id}">${ic('back')}${esc(quiz.title)}</a>

      <p class="muted" style="margin-bottom:8px">Question ${i + 1} of ${qs.length}</p><h2>${esc(x.question)}</h2>
      <div class="opts">${opts.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCDEF'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="after"></div></div>`;
    $$('.opt').forEach(b => b.onclick = () => {
      const k = +b.dataset.k, ok = k === x.correct_index; if (ok) score++; answers.push({ q: x.id, picked: k, ok });
      $$('.opt').forEach(o => { o.disabled = true; if (+o.dataset.k === x.correct_index) o.classList.add('right'); });
      if (!ok) b.classList.add('wrong');
      $('#after').innerHTML = `${x.explanation ? `<div class="explain">${esc(x.explanation)}</div>` : ''}<div style="margin-top:16px;display:flex;justify-content:flex-end"><button class="btn primary" id="nx">${i + 1 === qs.length ? 'See results' : 'Next'}</button></div>`;
      $('#nx').focus(); $('#nx').onclick = () => { i++; i < qs.length ? show() : finish(); };
    });
  };
  const finish = async () => {
    const pct = Math.round(score / qs.length * 100);
    v.innerHTML = `<div class="q"><div class="score glass"><b>${score}/${qs.length}</b><h3>${pct >= 80 ? 'Strong result' : pct >= 50 ? 'Getting there' : 'Worth another pass'}</h3><p style="margin:6px 0 22px">${pct}% correct</p><div style="display:flex;gap:8px;justify-content:center"><button class="btn" onclick="location.hash='#/quizzes'">All quizzes</button><button class="btn primary" id="again">Try again</button></div></div></div>`;
    $('#again').onclick = () => runQuiz(quiz, qs);
    sb.from('quiz_attempts').insert({ quiz_id: quiz.id, score, total: qs.length, answers }).then(({ error }) => error && toast('Could not save your result: ' + error.message, 'err'));
  };
  show();
}

async function callAI(body) {

const STOP = new Set('the and for that with this from are was were have has had what which when where who how why does did can could would should about into your you our their there them then than also but not any all more most some such only other these those its it is be to of in on as at by an or a if so do i me my we explain tell give show'.split(' '));
function localAnswer(question, ctx) {
  const words = [...new Set(question.toLowerCase().match(/[a-z0-9]{3,}/g) || [])].filter(w => !STOP.has(w));
  const sents = ctx.split(/(?<=[.!?])\s+|\n+/).map(s => s.trim()).filter(s => s.length > 25);
  const scored = sents.map((s, i) => ({ s, i, sc: words.reduce((n, w) => n + (s.toLowerCase().includes(w) ? 1 : 0), 0) })).filter(x => x.sc).sort((a, b) => b.sc - a.sc).slice(0, 5).sort((a, b) => a.i - b.i);
  if (!scored.length) return null;
  return scored.map(x => '- ' + x.s).join('\n');
}
function localCards(text, n) {
  const out = [], seen = new Set();
  const add = (f, b) => { f = f.trim(); b = b.trim(); if (f && b && !seen.has(f.toLowerCase())) { seen.add(f.toLowerCase()); out.push({ front: f, back: b[0].toUpperCase() + b.slice(1) }); } };
  for (const l of text.split(/\n+/).map(s => s.trim().replace(/^[-•*\d.)\s]+/, '')).filter(Boolean)) {
    const m = l.match(/^(.{2,60}?)\s*(?::| — | – | - )\s+(.{12,})$/); if (m) add(m[1], m[2]);
  }
  for (const s of text.split(/(?<=[.!?])\s+/)) {
    const m = s.match(/^([A-Z][^,.;:]{2,50}?)\s+(is|are|means|refers to)\s+(.{15,}?)[.!?]?$/); if (m) add(`What ${m[2] === 'are' ? 'are' : m[2] === 'is' ? 'is' : 'does'} ${m[1]}${m[2] === 'means' ? ' mean' : m[2] === 'refers to' ? ' refer to' : ''}?`, m[3]);
  }
  return out.slice(0, n);
}
function localQuiz(cards) {
  if (cards.length < 4) return [];
  return cards.map(c => {
    const others = shuffle(cards.filter(x => x !== c)).slice(0, 3).map(x => x.back.slice(0, 110)); const opts = shuffle([c.back.slice(0, 110), ...others]);
    return { question: c.front, options: opts, correct_index: opts.indexOf(c.back.slice(0, 110)), explanation: null };
  });
}

async function noteContext(ids, max = 60000) {
  if (!ids.length) return '';
  const rows = await q(sb.from('notes').select('title,content').in('id', ids));

}
const md = s => {
  const lines = esc(s).split('\n'); let html = '', list = false;
  for (let l of lines) {
    l = l.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
    const li = l.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
    if (li) { if (!list) { html += '<ul>'; list = true; } html += `<li>${li[1]}</li>`; }
    else { if (list) { html += '</ul>'; list = false; } if (l.trim()) html += `<p>${l}</p>`; }
  }
  return html + (list ? '</ul>' : '');
};

      <div class="field"><label>How many ${kind === 'cards' ? 'cards' : 'questions'}</label><input type="number" name="n" min="3" max="30" value="10"></div>`,
    onSubmit: async f => {
      const id = f.get('note'), n = Math.min(30, Math.max(3, +f.get('n') || 10)), note = notes.find(x => x.id === id), ctx = await noteContext([id], 40000);
      if (ctx.trim().length < 40) throw new Error('This note has too little text to work from.');
      let items, usedAI = true;
      try { const r = await callAI({ mode: kind === 'cards' ? 'flashcards' : 'quiz', context: ctx, count: n }); items = kind === 'cards' ? r.cards : r.questions; }
      catch (e) { usedAI = false; console.warn(e); const c = localCards(ctx, n); items = kind === 'cards' ? c : localQuiz(c); }
      if (!items?.length) throw new Error(usedAI ? 'Nothing came back. Try again.' : 'Not enough structured text to build from offline. Deploy the study-ai function for better results.');
      if (!usedAI) toast('Study AI isn’t connected, so this was built from the note’s structure.');
      kind === 'cards' ? await saveDeck(note.title, items, id) : await saveQuiz(note.title + ' quiz', items.map((x, i) => ({ question: x.question, options: x.options, correct_index: x.correct_index, explanation: x.explanation || null })), id);
    },
  });
}

/* ───────── actions ───────── */
const actions = {
  theme: toggleTheme,
  signout: async () => { await sb.auth.signOut(); },
  'pick-file': () => $('#fileIn').click(),
  'new-note': () => sheet({
    title: 'New note', body: `<div class="field"><label>Title</label><input type="text" name="title" placeholder="Untitled"></div><div class="field"><label>Text</label><textarea name="content" rows="8" placeholder="Paste or type your notes"></textarea></div>`,
    onSubmit: async f => { const n = await q(sb.from('notes').insert({ title: f.get('title').trim() || 'Untitled', content: f.get('content') }).select().single()); location.hash = '#/notes/' + n.id; },
  }),
  'del-note': t => confirmSheet('Delete this note?', 'The note and its original file will be removed. Decks and quizzes made from it stay.', 'Delete', async () => {
    if (t.dataset.path) await sb.storage.from('notes').remove([t.dataset.path]);
    await q(sb.from('notes').delete().eq('id', t.dataset.id)); location.hash = '#/notes';
  }),
  'dl-note': async t => { const { data, error } = await sb.storage.from('notes').createSignedUrl(t.dataset.path, 60, { download: t.dataset.name }); if (error) return toast(error.message, 'err'); location.href = data.signedUrl; },
  'ask-ai': t => { state.aiNotes = [t.dataset.id]; location.hash = '#/ai'; },
  'gen-cards': t => generateSheet('cards', t.dataset.id),
  'gen-quiz': t => generateSheet('quiz', t.dataset.id),
  'new-deck': () => sheet({
    title: 'New deck', body: `<div class="field"><label>Title</label><input type="text" name="title" placeholder="Cell biology" required></div><div class="field"><label>Description (optional)</label><input type="text" name="d"></div>`,
    onSubmit: async f => { if (!f.get('title').trim()) throw new Error('Give the deck a title.'); const d = await q(sb.from('decks').insert({ title: f.get('title').trim(), description: f.get('d').trim() || null }).select().single()); location.hash = '#/flashcards/' + d.id; },
  }),
  'del-deck': t => confirmSheet('Delete this deck?', 'All of its cards will be deleted.', 'Delete', async () => { await q(sb.from('decks').delete().eq('id', t.dataset.id)); location.hash = '#/flashcards'; }),
  'add-card': t => sheet({
    title: 'Add card', body: `<div class="field"><label>Front</label><textarea name="f" rows="3" required></textarea></div><div class="field"><label>Back</label><textarea name="b" rows="3" required></textarea></div>`,
    onSubmit: async f => { if (!f.get('f').trim() || !f.get('b').trim()) throw new Error('Fill in both sides.'); await q(sb.from('flashcards').insert({ deck_id: t.dataset.id, front: f.get('f').trim(), back: f.get('b').trim() })); route(); },
  }),
  'edit-card': t => sheet({
    title: 'Edit card', body: `<div class="field"><label>Front</label><textarea name="f" rows="3">${esc(t.dataset.f)}</textarea></div><div class="field"><label>Back</label><textarea name="b" rows="3">${esc(t.dataset.b)}</textarea></div>`,
    onSubmit: async f => { await q(sb.from('flashcards').update({ front: f.get('f').trim(), back: f.get('b').trim() }).eq('id', t.dataset.id)); route(); },
  }),
  'del-card': async t => { await q(sb.from('flashcards').delete().eq('id', t.dataset.id)); route(); },
  'new-quiz': newQuizSheet,
  'del-quiz': t => confirmSheet('Delete this quiz?', 'Its questions and past attempts will be deleted.', 'Delete', async () => { await q(sb.from('quizzes').delete().eq('id', t.dataset.id)); location.hash = '#/quizzes'; }),
};
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t) return; Promise.resolve(actions[t.dataset.act]?.(t, e)).catch(err => toast(err.message || String(err), 'err')); });
$('#fileIn').addEventListener('change', e => { uploadFiles([...e.target.files]); e.target.value = ''; });

/* ───────── boot ───────── */
let lastUser = undefined;
async function onSession(session) {
  const u = session?.user || null;
  if (u?.id === lastUser?.id && lastUser !== undefined) { state.user = u; return; }
  lastUser = u; state.user = u;
  if (!u) { renderAuth(); applyTheme(document.documentElement.dataset.theme); return; }
  renderShell(); await loadSettings(); route();
}
sb.auth.onAuthStateChange((_ev, session) => { setTimeout(() => onSession(session), 0); });
sb.auth.getSession().then(({ data }) => onSession(data.session));
</script>
</body>
</html>
